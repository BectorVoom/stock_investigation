[package]
name = "research-net"
description = "DNS-pinned HTTPS fetcher with keep-alive reuse (SEC-002, ADR-0030 C1) and the page archive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
research-js = { workspace = true }
research-domain = { workspace = true }
research-application = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
webpki-roots = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
# zlib-rs: a port of zlib itself, so gzip header/CRC handling and error
# classes match Node's zlib (and it is faster than miniz_oxide).
flate2 = { workspace = true, features = ["zlib-rs"] }
brotli-decompressor = { workspace = true }
futures-util = { workspace = true }
getrandom = { workspace = true }
libc = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
encoding_rs = { workspace = true }

[features]
default = []
# Loopback dialing, extra trusted roots, injected DNS/connections and assumed-
# valid addresses for tests. NEVER enabled by the production binary
# (checked by `seam_gate` in src/lib.rs).
test-seams = []

[dev-dependencies]
research-net = { workspace = true, features = ["test-seams"] }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
