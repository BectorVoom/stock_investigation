[package]
name = "research-runner"
description = "The local runner: polls the Worker API and executes claimed jobs (ADR-0030)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "research-runner"
path = "src/main.rs"

# `cargo build -p research-runner` does not build the binaries of dependencies,
# and the launcher ships this companion beside the runner (it is the safe
# setsid/exec trampoline the agent CLIs are started through).
[[bin]]
name = "research-provider-spawn"
path = "src/bin/research-provider-spawn.rs"

[dependencies]
research-js = { workspace = true }
research-effects = { workspace = true }
research-domain = { workspace = true }
research-contracts = { workspace = true }
research-agent-core = { workspace = true }
research-application = { workspace = true }
research-net = { workspace = true }
research-feed = { workspace = true }
research-tools = { workspace = true }
research-providers = { workspace = true }
research-finance = { workspace = true }
research-google = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
getrandom = { workspace = true }
hex = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tokio-util = { workspace = true }
url = { workspace = true }
webpki-roots = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
