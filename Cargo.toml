# The Rust runner (ADR-0030). One production binary, `research-runner`; the
# Worker API, the web app and the MCP server stay TypeScript.
#
# Crate boundaries mirror the TypeScript packages, and dependencies point the
# same way (docs/ENGINEERING_DESIGN_RULES.md section 3): domain and js are
# pure, contracts depends on them, application depends on ports, adapters
# (net, html, feed, tools, providers, finance, google) implement the ports,
# and only research-runner composes them. research-runner-testkit holds the
# E2E seams; the production binary never depends on it.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
research-js = { path = "crates/research-js" }
research-effects = { path = "crates/research-effects" }
research-domain = { path = "crates/research-domain" }
research-contracts = { path = "crates/research-contracts" }
research-widget-grid = { path = "crates/research-widget-grid" }
research-agent-core = { path = "crates/research-agent-core" }
research-application = { path = "crates/research-application" }
research-net = { path = "crates/research-net" }
research-html = { path = "crates/research-html" }
research-feed = { path = "crates/research-feed" }
research-tools = { path = "crates/research-tools" }
research-providers = { path = "crates/research-providers" }
research-finance = { path = "crates/research-finance" }
research-google = { path = "crates/research-google" }
research-runner = { path = "crates/research-runner" }

# External crates: every version below was in the local cargo cache when the
# workspace was created (the machine works offline with `--locked`).
aho-corasick = "1.1"
async-trait = "0.1"
base64 = "0.22"
brotli-decompressor = "5"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
flate2 = "1"
futures-util = "0.3"
getrandom = "0.2"
hex = "0.4"
httparse = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
indexmap = "2"
libc = "0.2"
memchr = "2"
rustix = { version = "1", features = ["process"] }
percent-encoding = "2"
quick-xml = "0.38"
rayon = "1"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1"
signal-hook = { version = "0.4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "process", "fs", "net", "io-util", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-util = "0.7"
unicode-normalization = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }
webpki-roots = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

# Hostile input reaches most of this code (pages, feeds, agent output): a
# panic or a lossy cast is a defect, not a shortcut. Tests may unwrap/index
# (clippy.toml).
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_lossless = "warn"

# Disk on the owner's machine is tight (ADR-0030): no debug info in dev
# builds, optimised dependencies (faster tests, smaller artifacts).
[profile.dev]
debug = false
incremental = false

[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.test]
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false
strip = "symbols"
# A panic inside a job is caught at the job boundary and reported as a
# retryable failure (ADR-0030 decision 7), so unwinding must stay on.
panic = "unwind"
